<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SIMPUS-Mini | Daftar Buku</title>
    <link rel="stylesheet" href="../assets/style.css" />
  </head>
  <body>
    <header>
      <h1>SIMPUS-Mini</h1>
      <!-- Tombol buka-tutup menu navigasi untuk tampilan HP -->
      <button type="button" id="nav-toggle-btn" class="nav-toggle-label" aria-label="Menu">&#9776;</button>
      <nav>
        <ul>
          <li><a href="../index.html">Beranda</a></li>
          <li><a href="list.html">Daftar Buku</a></li>
          <li><a href="tambah.html">Tambah Buku</a></li>
          <li><a href="../anggota/list.html">Daftar Anggota</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <section>
        <h2>Daftar Buku</h2>
        <!-- Form input filter pencarian data buku secara real-time -->
        <div class="search-box">
          <label for="search-input">Cari Judul Buku</label>
          <input type="text" id="search-input" placeholder="Ketik judul buku..." />
        </div>

        <!-- Teks status saat mengambil data buku dari file JSON -->
        <p id="loading-indicator" style="display:none;">Memuat data...</p>

        <div class="table-responsive">
          <table>
            <thead>
              <tr>
                <th>Judul</th>
                <th>Pengarang</th>
                <th>Tahun</th>
                <th>Stok</th>
                <th>Aksi</th>
              </tr>
            </thead>
            <tbody>
              <!-- Isi tabel akan di-generate otomatis oleh buku.js -->
            </tbody>
          </table>
        </div>
      </section>
    </main>

    <footer>
      <p>&copy; 2026 SIMPUS-Mini &mdash; Jobsheet 6</p>
    </footer>

    <!-- Script penanganan navigasi dan pemuatan data buku -->
    <script src="../assets/app.js"></script>
    <script src="../assets/buku.js"></script>
  </body>
</html>
